<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مدیریت | STUDIO VOID</title><link rel="stylesheet" href="admin.css"></head><body>
<header><a href="index.html">← بازگشت به سایت</a><h1>پنل مدیریت <span>VOID</span></h1><p>مدیریت محتوای سایت</p></header>
<main>
<section id="loginPanel" class="panel auth-panel"><h2>ورود مدیر</h2><p class="hint">فقط حسابی که نقش admin در app_metadata دارد اجازه ورود به پنل را دارد.</p><form id="loginForm"><label>ایمیل<input id="email" type="email" autocomplete="username" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">ورود امن</button><p id="loginMessage" class="message" role="status"></p></form></section>
<div id="adminApp" hidden>
<div class="toolbar"><span id="signedInAs"></span><button id="logout" class="danger">خروج</button></div>
<section class="stats"><article><b id="totalProjects">۰</b><span>پروژه‌ها</span></article><article><b id="totalCategories">۰</b><span>دسته‌بندی‌ها</span></article><article><b id="totalAnnouncements">۰</b><span>اطلاعیه‌ها</span></article></section>
<section class="panel"><h2>افزودن / ویرایش پروژه</h2><form id="projectForm"><input type="hidden" id="projectId"><div class="fields">
<label>عنوان فارسی<input id="titleFa" required maxlength="160"></label><label>عنوان انگلیسی<input id="titleEn" maxlength="160"></label>
<label>دسته‌بندی<select id="categoryId"></select></label><label>ترتیب نمایش<input id="sortOrder" type="number" value="0"></label>
<label>لینک پروژه<input id="projectUrl" type="url" placeholder="https://..."></label><label>آدرس تصویر<input id="imageUrl" type="url" placeholder="https://..."></label>
<label class="check"><input id="featured" type="checkbox"> پروژه ویژه</label><label class="check"><input id="published" type="checkbox" checked> انتشار در سایت</label>
<label class="wide">توضیحات فارسی<textarea id="descriptionFa"></textarea></label><label class="wide">توضیحات انگلیسی<textarea id="descriptionEn"></textarea></label>
</div><div class="actions"><button class="primary" type="submit">ذخیره پروژه</button><button type="button" id="clearProject">پاک‌کردن فرم</button></div><p id="projectMessage" class="message" role="status"></p></form></section>
<section class="panel"><h2>پروژه‌های ثبت‌شده</h2><div id="projectList"></div></section>
<section class="panel"><h2>دسته‌بندی‌ها</h2><form id="categoryForm" class="inline"><input id="categoryFa" placeholder="نام فارسی" required><input id="categoryEn" placeholder="English name" required><input id="categorySlug" placeholder="slug (e.g. website)" required pattern="[a-z0-9-]+"><input id="categorySort" type="number" value="0"><button class="primary">افزودن دسته</button></form><div id="categoryList"></div></section>
<section class="panel"><h2>اطلاعیه بالای سایت</h2><form id="announcementForm"><input type="hidden" id="announcementId"><div class="fields"><label>عنوان فارسی<input id="noticeTitleFa"></label><label>عنوان انگلیسی<input id="noticeTitleEn"></label><label class="wide">متن فارسی<textarea id="noticeBodyFa"></textarea></label><label class="wide">متن انگلیسی<textarea id="noticeBodyEn"></textarea></label><label class="check"><input id="noticeActive" type="checkbox"> فعال و قابل نمایش</label></div><div class="actions"><button class="primary">ذخیره اطلاعیه</button><button type="button" id="newAnnouncement">اطلاعیه جدید</button></div><p id="announcementMessage" class="message" role="status"></p></form><div id="announcementList"></div></section>
<section class="panel"><h2>تنظیمات پایه سایت</h2><form id="settingsForm"><div class="fields"><label>عنوان فارسی سایت<input id="settingTitleFa"></label><label>عنوان انگلیسی سایت<input id="settingTitleEn"></label><label>ایمیل تماس<input id="settingEmail" type="email"></label><label>متن کوتاه فارسی<input id="settingTaglineFa"></label><label>متن کوتاه انگلیسی<input id="settingTaglineEn"></label></div><button class="primary">ذخیره تنظیمات</button><p id="settingsMessage" class="message" role="status"></p></form></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
